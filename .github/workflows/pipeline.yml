name: Continuous Integration
on: [push]

permissions:
  contents: read

jobs:

  test:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/master'
    name: fmt, lint, test
    env:
      ENVIRONMENT: ci
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v6

    - name: Run fmt
      run: make fmt

    - name: Run lint
      run: make lint

    - name: Run tests
      run: make test

  security:
    runs-on: ubuntu-latest
    name: trivy scan
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Check out code
      uses: actions/checkout@v6

    # Pinned to an immutable commit SHA (v0.36.0) rather than a mutable tag,
    # as trivy-action tags were compromised in a March 2026 supply chain attack.
    # Scan policy (scanners, severity, exit code, ignores) lives in
    # trivy.yaml / .trivyignore so local scans behave the same as CI.
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        trivy-config: 'trivy.yaml'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      if: always()
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-results.sarif'

  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    needs: [security]
    name: test, coverage export and tag
    permissions:
      contents: write
    env:
      ENVIRONMENT: ci
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v6

    - name: Run tests
      run: make test

    - name: Run tag export
      run: ./scripts/ci/tag.sh
